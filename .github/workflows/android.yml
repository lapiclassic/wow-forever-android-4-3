name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Build Release APK
        run: ./gradlew assembleModernRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wow-forever-4-3-apk
          path: app/build/outputs/apk/modern/release/*.apk
